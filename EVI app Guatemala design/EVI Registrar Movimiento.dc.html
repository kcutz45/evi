<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #E9E4FB; font-family: Nunito, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  a { color: #6C3BF4; text-decoration: none; }
  a:hover { color: #5528DC; }
  input { font-family: inherit; }
  input::placeholder { color: #A49CC4; }
  ::-webkit-scrollbar { width: 0; height: 0; }
</style>
</helmet>
<div style="width: 390px; height: 844px; margin: 0 auto; background: #F5F2FF; color: #1A1035; display: flex; flex-direction: column; overflow: hidden; font-family: Nunito, system-ui, sans-serif;">

  <div style="flex: none; padding: 16px 20px 0; display: flex; align-items: center; gap: 12px;">
    <button type="button" style="width: 40px; height: 40px; border: none; border-radius: 14px; background: #fff; color: #1A1035; display: grid; place-items: center; cursor: pointer;" style-hover="background: #EFE9FF;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="M6 6l12 12"></path></svg>
    </button>
    <span style="font-size: 16px; font-weight: 800; letter-spacing: -0.01em;">Nuevo movimiento</span>
  </div>

  <div style="flex: none; padding: 14px 20px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: transparent;">
    <div style="grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: #EBE5FC; border-radius: 18px; padding: 5px;">
      <button type="button" onClick="{{ elegirGasto }}" style="{{ estiloGasto }}">Gasto</button>
      <button type="button" onClick="{{ elegirIngreso }}" style="{{ estiloIngreso }}">Ingreso</button>
    </div>
  </div>

  <div style="flex: none; padding: 26px 20px 20px; display: flex; flex-direction: column; align-items: center; gap: 6px;">
    <div style="font-size: 12.5px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #8B83AD;">{{ etiquetaTipo }}</div>
    <div style="font-size: 56px; font-weight: 900; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; color: {{ colorMonto }};">{{ montoTexto }}</div>
  </div>

  <div style="flex: none; padding: 0 20px 4px;">
    <div style="display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x proximity;">
      <sc-for list="{{ categorias }}" as="c" hint-placeholder-count="6">
        <button type="button" data-cat="{{ c.id }}" onClick="{{ c.elegir }}" style="{{ c.estilo }}">
          <span style="{{ c.estiloIcono }}" dangerouslySetInnerHTML="{{ c.icono }}"></span>
          <span style="font-size: 12px; font-weight: 800; letter-spacing: -0.01em;">{{ c.nombre }}</span>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="flex: none; padding: 10px 20px 0; display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 16px; padding: 11px 14px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#A49CC4" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h10"></path></svg>
      <input type="text" placeholder="Nota (opcional)" style="flex: 1; border: none; outline: none; background: transparent; font-size: 13.5px; font-weight: 700; color: #1A1035;">
    </div>

    <div style="position: relative; display: flex; flex-direction: column;">
    <button type="button" onClick="{{ alternarEventos }}" style="display: flex; align-items: center; gap: 8px; background: #fff; border: none; border-radius: 16px; padding: 11px 14px; cursor: pointer; text-align: left; font-family: inherit; color: #1A1035;" style-hover="background: #F7F4FF;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6C3BF4" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><rect x="3" y="6" width="18" height="15"></rect><path d="M3 11h18"></path><path d="M8 6V3"></path><path d="M16 6V3"></path></svg>
      <span style="flex: 1; font-size: 13.5px; font-weight: 700; color: {{ colorEvento }};">{{ textoEvento }}</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A49CC4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><path d="M9 6l6 6-6 6"></path></svg>
    </button>

    <sc-if value="{{ eventosAbiertos }}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 20; display: flex; flex-direction: column; gap: 6px; background: #fff; border-radius: 16px; padding: 8px; box-shadow: 0 14px 34px rgba(26,16,53,0.18);">
        <sc-for list="{{ eventos }}" as="e" hint-placeholder-count="3">
          <button type="button" onClick="{{ e.elegir }}" style="{{ e.estilo }}">{{ e.nombre }}</button>
        </sc-for>
      </div>
    </sc-if>
    </div>
  </div>

  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 12px 16px 0;">
    <div onClick="{{ onTeclado }}" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
      <button type="button" data-k="1" style="border: none; background: #fff; border-radius: 18px; height: 56px; font-family: inherit; font-size: 25px; font-weight: 800; color: #1A1035; cursor: pointer;" style-hover="background: #EFE9FF;">1</button>
      <button type="button" data-k="2" style="border: none; background: #fff; border-radius: 18px; height: 56px; font-family: inherit; font-size: 25px; font-weight: 800; color: #1A1035; cursor: pointer;" style-hover="background: #EFE9FF;">2</button>
      <button type="button" data-k="3" style="border: none; background: #fff; border-radius: 18px; height: 56px; font-family: inherit; font-size: 25px; font-weight: 800; color: #1A1035; cursor: pointer;" style-hover="background: #EFE9FF;">3</button>
      <button type="button" data-k="4" style="border: none; background: #fff; border-radius: 18px; height: 56px; font-family: inherit; font-size: 25px; font-weight: 800; color: #1A1035; cursor: pointer;" style-hover="background: #EFE9FF;">4</button>
      <button type="button" data-k="5" style="border: none; background: #fff; border-radius: 18px; height: 56px; font-family: inherit; font-size: 25px; font-weight: 800; color: #1A1035; cursor: pointer;" style-hover="background: #EFE9FF;">5</button>
      <button type="button" data-k="6" style="border: none; background: #fff; border-radius: 18px; height: 56px; font-family: inherit; font-size: 25px; font-weight: 800; color: #1A1035; cursor: pointer;" style-hover="background: #EFE9FF;">6</button>
      <button type="button" data-k="7" style="border: none; background: #fff; border-radius: 18px; height: 56px; font-family: inherit; font-size: 25px; font-weight: 800; color: #1A1035; cursor: pointer;" style-hover="background: #EFE9FF;">7</button>
      <button type="button" data-k="8" style="border: none; background: #fff; border-radius: 18px; height: 56px; font-family: inherit; font-size: 25px; font-weight: 800; color: #1A1035; cursor: pointer;" style-hover="background: #EFE9FF;">8</button>
      <button type="button" data-k="9" style="border: none; background: #fff; border-radius: 18px; height: 56px; font-family: inherit; font-size: 25px; font-weight: 800; color: #1A1035; cursor: pointer;" style-hover="background: #EFE9FF;">9</button>
      <button type="button" data-k="." style="border: none; background: #EFE9FF; border-radius: 18px; height: 56px; font-family: inherit; font-size: 25px; font-weight: 800; color: #6C3BF4; cursor: pointer;" style-hover="background: #E3D9FF;">.</button>
      <button type="button" data-k="0" style="border: none; background: #fff; border-radius: 18px; height: 56px; font-family: inherit; font-size: 25px; font-weight: 800; color: #1A1035; cursor: pointer;" style-hover="background: #EFE9FF;">0</button>
      <button type="button" data-k="del" style="border: none; background: #EFE9FF; border-radius: 18px; height: 56px; display: grid; place-items: center; color: #6C3BF4; cursor: pointer;" style-hover="background: #E3D9FF;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 5H9l-6 7 6 7h11z"></path><path d="M17 9l-5 6"></path><path d="M12 9l5 6"></path></svg>
      </button>
    </div>
  </div>

  <div style="flex: none; padding: 14px 16px 24px;">
    <button type="button" onClick="{{ guardar }}" style="{{ estiloGuardar }}">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
      <span>{{ textoGuardar }}</span>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
const ICONOS = {
  comida: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v8a3 3 0 0 0 6 0V3"></path><path d="M9 11v10"></path><path d="M17 3c1.5 1.5 2 3 2 5s-.8 3-2 3-2-1-2-3 .5-3.5 2-5Z"></path><path d="M17 11v10"></path></svg>',
  transporte: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17V6h14v11"></path><path d="M5 12h14"></path><circle cx="8" cy="18" r="1.4"></circle><circle cx="16" cy="18" r="1.4"></circle></svg>',
  evento: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="15"></rect><path d="M3 11h18"></path><path d="M8 6V3"></path><path d="M16 6V3"></path></svg>',
  estudio: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9-4 9 4-9 4-9-4Z"></path><path d="M7 10v5c0 1.7 2.2 3 5 3s5-1.3 5-3v-5"></path></svg>',
  salud: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-9.3A4 4 0 0 1 12 8a4 4 0 0 1 7 2.7C19 15.6 12 20 12 20Z"></path></svg>',
  otros: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="12" r="1.1"></circle><circle cx="12" cy="12" r="1.1"></circle><circle cx="18.5" cy="12" r="1.1"></circle></svg>'
};
const CATS = [
  { id: 'comida', nombre: 'Comida' },
  { id: 'transporte', nombre: 'Transporte' },
  { id: 'evento', nombre: 'Evento' },
  { id: 'estudio', nombre: 'Estudio' },
  { id: 'salud', nombre: 'Salud' },
  { id: 'otros', nombre: 'Otros' }
];
const EVENTOS = ['Tardeada en Antigua', 'Cumple de Josué', 'Viaje a Atitlán'];

class Component extends DCLogic {
  state = { tipo: 'gasto', monto: '', categoria: 'comida', evento: null, eventosAbiertos: false, guardado: false };

  formatear(raw) {
    if (!raw) return 'Q0.00';
    const [ent, dec] = raw.split('.');
    const entero = Number(ent || 0).toLocaleString('en-US');
    if (dec === undefined) return 'Q' + entero + '.00';
    return 'Q' + entero + '.' + (dec + '00').slice(0, 2);
  }

  tecla = (k) => {
    this.setState(s => {
      let m = s.monto;
      if (k === 'del') m = m.slice(0, -1);
      else if (k === '.') { if (!m.includes('.')) m = (m || '0') + '.'; }
      else {
        const [, dec] = m.split('.');
        if (dec !== undefined && dec.length >= 2) return null;
        if (m === '' && k === '0') return null;
        if (m.replace('.', '').length >= 9) return null;
        m = m + k;
      }
      return { monto: m, guardado: false };
    });
  };

  renderVals() {
    const { tipo, monto, categoria, evento, eventosAbiertos, guardado } = this.state;
    const activo = tipo === 'gasto';
    const tabBase = { border: 'none', borderRadius: '14px', padding: '11px 0', fontFamily: 'inherit', fontSize: '15px', fontWeight: 800, cursor: 'pointer', letterSpacing: '-0.01em', transition: 'background .15s' };
    const tabOn = { ...tabBase, background: '#6C3BF4', color: '#fff', boxShadow: '0 4px 12px rgba(108,59,244,0.28)' };
    const tabOff = { ...tabBase, background: 'transparent', color: '#7A719F' };

    return {
      etiquetaTipo: activo ? 'Monto del gasto' : 'Monto del ingreso',
      montoTexto: this.formatear(monto),
      colorMonto: monto ? (activo ? '#1A1035' : '#0E8F63') : '#C7BFE4',
      estiloGasto: activo ? tabOn : tabOff,
      estiloIngreso: activo ? tabOff : { ...tabBase, background: '#2EE6A8', color: '#08301F', boxShadow: '0 4px 12px rgba(46,230,168,0.35)' },
      elegirGasto: () => this.setState({ tipo: 'gasto' }),
      elegirIngreso: () => this.setState({ tipo: 'ingreso' }),

      categorias: CATS.map(c => {
        const sel = c.id === categoria;
        return {
          id: c.id,
          nombre: c.nombre,
          icono: { __html: ICONOS[c.id] },
          elegir: () => this.setState({ categoria: c.id, guardado: false }),
          estilo: {
            flex: 'none', width: '84px', border: 'none', cursor: 'pointer', fontFamily: 'inherit',
            borderRadius: '18px', padding: '12px 6px 10px', display: 'flex', flexDirection: 'column',
            alignItems: 'center', gap: '7px', scrollSnapAlign: 'start',
            background: sel ? '#6C3BF4' : '#fff',
            color: sel ? '#fff' : '#1A1035',
            boxShadow: sel ? '0 6px 16px rgba(108,59,244,0.3)' : '0 3px 10px rgba(26,16,53,0.05)'
          },
          estiloIcono: { display: 'grid', placeItems: 'center', color: sel ? '#fff' : '#6C3BF4' }
        };
      }),

      textoEvento: evento || 'Asignar a un evento (opcional)',
      colorEvento: evento ? '#1A1035' : '#8B83AD',
      eventosAbiertos,
      alternarEventos: () => this.setState(s => ({ eventosAbiertos: !s.eventosAbiertos })),
      eventos: [...EVENTOS, 'Ninguno'].map(n => ({
        nombre: n,
        elegir: () => this.setState({ evento: n === 'Ninguno' ? null : n, eventosAbiertos: false }),
        estilo: {
          border: 'none', textAlign: 'left', fontFamily: 'inherit', cursor: 'pointer',
          borderRadius: '12px', padding: '10px 12px', fontSize: '13.5px', fontWeight: 800,
          background: evento === n ? '#EFE9FF' : 'transparent',
          color: n === 'Ninguno' ? '#8B83AD' : '#1A1035'
        }
      })),

      onTeclado: (e) => {
        const b = e.target.closest('[data-k]');
        if (b) this.tecla(b.getAttribute('data-k'));
      },

      textoGuardar: guardado ? 'Guardado' : 'Guardar',
      estiloGuardar: {
        width: '100%', border: 'none', borderRadius: '20px', height: '60px', cursor: 'pointer',
        fontFamily: 'inherit', fontSize: '18px', fontWeight: 900, letterSpacing: '-0.01em',
        display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '10px',
        background: monto ? '#2EE6A8' : '#CBEFE1',
        color: monto ? '#08301F' : '#7FAF9C',
        boxShadow: monto ? '0 8px 22px rgba(46,230,168,0.4)' : 'none'
      },
      guardar: () => { if (monto) this.setState({ guardado: true }); }
    };
  }
}
</script>
</body>
</html>
