<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #E9E4FB; font-family: Nunito, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  a { color: #6C3BF4; text-decoration: none; }
  a:hover { color: #5528DC; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  @keyframes evi-sheet { from { transform: translateY(46px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes evi-viaje {
    0%   { transform: translateX(0) scale(0.94); opacity: 0; }
    12%  { transform: translateX(0) scale(1); opacity: 1; }
    62%  { transform: translateX(148px) scale(1); opacity: 1; }
    76%  { transform: translateX(148px) scale(0.9); opacity: 0; }
    100% { transform: translateX(148px) scale(0.9); opacity: 0; }
  }
  @keyframes evi-pulso { 0%,100% { box-shadow: 0 0 0 0 rgba(46,230,168,0.5); } 55% { box-shadow: 0 0 0 12px rgba(46,230,168,0); } }
  @keyframes evi-dash { to { stroke-dashoffset: -28; } }
</style>
</helmet>
<div style="width: 390px; height: 844px; margin: 0 auto; background: #1A1035; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; position: relative; font-family: Nunito, system-ui, sans-serif;">

  <div style="position: absolute; inset: 0; padding: 24px 20px; opacity: 0.28; display: flex; flex-direction: column; gap: 14px; filter: blur(1.5px);">
    <div style="height: 26px; width: 62%; border-radius: 10px; background: #F5F2FF;"></div>
    <div style="height: 118px; border-radius: 20px; background: #F5F2FF;"></div>
    <div style="height: 118px; border-radius: 20px; background: #F5F2FF;"></div>
    <div style="height: 118px; border-radius: 20px; background: #F5F2FF;"></div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(26,16,53,0.72);"></div>

  <div style="position: relative; background: #F5F2FF; border-radius: 28px 28px 0 0; padding: 8px 20px 22px; max-height: 100%; overflow-y: auto; box-shadow: 0 -20px 60px rgba(0,0,0,0.4); animation: evi-sheet 0.45s cubic-bezier(0.22,1,0.36,1) both;">

    <div style="width: 44px; height: 5px; border-radius: 99px; background: #D9D1F2; margin: 0 auto 14px;"></div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;">
      <span style="display: inline-flex; align-items: center; gap: 6px; background: rgba(108,59,244,0.12); color: #5528DC; font-size: 11.5px; font-weight: 900; letter-spacing: 0.09em; text-transform: uppercase; padding: 7px 12px; border-radius: 12px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
        Cierre de evento
      </span>
      <span style="font-size: 24px; font-weight: 900; letter-spacing: -0.032em; line-height: 1.15; color: #1A1035; text-wrap: pretty; padding: 0 6px;">Cerrar Cumpleaños de Sofía</span>
    </div>

    <div style="background: #fff; border-radius: 22px; padding: 15px; margin-top: 16px; box-shadow: 0 6px 18px rgba(26,16,53,0.06);">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <span style="font-size: 11.5px; font-weight: 900; letter-spacing: 0.07em; text-transform: uppercase; color: #8B83AD;">Planificado</span>
          <span style="font-size: 21px; font-weight: 900; letter-spacing: -0.03em; color: #1A1035; font-variant-numeric: tabular-nums;">{{ planificado }}</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 3px; padding-left: 14px; border-left: 1px solid #F0ECFB;">
          <span style="font-size: 11.5px; font-weight: 900; letter-spacing: 0.07em; text-transform: uppercase; color: #8B83AD;">Gasto real</span>
          <span style="font-size: 21px; font-weight: 900; letter-spacing: -0.03em; color: #1A1035; font-variant-numeric: tabular-nums;">{{ real }}</span>
        </div>
      </div>
      <div style="height: 9px; border-radius: 99px; background: #F2EEFF; overflow: hidden; margin-top: 14px;">
        <div style="height: 100%; border-radius: 99px; width: {{ ancho }}; background: {{ colorBarra }};"></div>
      </div>
      <div style="{{ estiloChip }}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><path d="M7 10l5 5 5-5"></path></svg>
        <span>{{ textoDiferencia }}</span>
      </div>
    </div>

    <div style="background: #fff; border-radius: 22px; padding: 14px 15px 14px; margin-top: 10px; box-shadow: 0 6px 18px rgba(26,16,53,0.06);">
      <div style="position: relative; height: 84px; display: flex; align-items: center; justify-content: space-between;">

        <div style="width: 88px; display: flex; flex-direction: column; align-items: center; gap: 8px; flex: none;">
          <div style="width: 54px; height: 54px; border-radius: 20px; background: rgba(108,59,244,0.13); color: #6C3BF4; display: grid; place-items: center;">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="15"></rect><path d="M3 11h18"></path><path d="M8 6V3"></path><path d="M16 6V3"></path></svg>
          </div>
          <span style="font-size: 11.5px; font-weight: 900; color: #4B4370;">Eventos</span>
        </div>

        <div style="flex: 1; position: relative; height: 84px;">
          <svg viewBox="0 0 148 84" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%;">
            <path d="M2 42 H146" fill="none" stroke="#E3DBF8" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 8" style="animation: evi-dash 1.4s linear infinite;"></path>
          </svg>
          <div style="position: absolute; left: -12px; top: 6px; width: 34px; height: 22px; border-radius: 8px; background: #EFE9FF; border: 1.5px solid #C9B6FF; display: grid; place-items: center; font-size: 10px; font-weight: 900; color: #5528DC; animation: evi-viaje 2.4s cubic-bezier(0.5,0,0.5,1) infinite;">Q</div>
          <div style="position: absolute; left: -12px; top: 31px; width: 34px; height: 22px; border-radius: 8px; background: #EFE9FF; border: 1.5px solid #C9B6FF; display: grid; place-items: center; font-size: 10px; font-weight: 900; color: #5528DC; animation: evi-viaje 2.4s cubic-bezier(0.5,0,0.5,1) 0.32s infinite;">Q</div>
          <div style="position: absolute; left: -12px; top: 56px; width: 34px; height: 22px; border-radius: 8px; background: #EFE9FF; border: 1.5px solid #C9B6FF; display: grid; place-items: center; font-size: 10px; font-weight: 900; color: #5528DC; animation: evi-viaje 2.4s cubic-bezier(0.5,0,0.5,1) 0.64s infinite;">Q</div>
          <div style="position: absolute; left: 50%; top: 48%; transform: translate(-50%,-50%); width: 26px; height: 26px; border-radius: 10px; background: #fff; color: #A49CC4; display: grid; place-items: center;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
          </div>
        </div>

        <div style="width: 88px; display: flex; flex-direction: column; align-items: center; gap: 8px; flex: none;">
          <div style="width: 54px; height: 54px; border-radius: 20px; background: rgba(46,230,168,0.18); color: #0E8F63; display: grid; place-items: center; animation: evi-pulso 2.4s ease-out infinite;">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12"></rect><circle cx="12" cy="12" r="2.4"></circle></svg>
          </div>
          <span style="font-size: 11.5px; font-weight: 900; color: #4B4370;">Mis finanzas</span>
        </div>
      </div>

      <div style="font-size: 15px; font-weight: 700; color: #3B3363; line-height: 1.5; text-align: center; text-wrap: pretty; padding: 12px 2px 0; border-top: 1px solid #F0ECFB; margin-top: 2px;">Los <strong style="font-weight: 900; color: #1A1035;">12 gastos</strong> de este evento (<strong style="font-weight: 900; color: #1A1035;">{{ real }}</strong>) pasarán a tus finanzas personales del mes de <strong style="font-weight: 900; color: #1A1035;">septiembre</strong>.</div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; justify-content: center; margin-top: 10px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8B83AD" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v.01"></path><path d="M12 11v5"></path></svg>
      <span style="font-size: 12.5px; font-weight: 700; color: #6F669B;">Después de cerrarlo ya no podrás agregar gastos.</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 14px;">
      <button type="button" onClick="{{ confirmar }}" style="{{ estiloPrimario }}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><path d="M20 6 9 17l-5-5"></path></svg>
        <span>{{ textoPrimario }}</span>
      </button>
      <button type="button" style="width: 100%; border: none; border-radius: 20px; height: 50px; background: transparent; color: #6F669B; font-family: inherit; font-size: 15.5px; font-weight: 900; cursor: pointer;" style-hover="background: #EBE5FC; color: #4B4370;">Todavía no</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;planificado&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:2000,&quot;min&quot;:0,&quot;max&quot;:20000,&quot;step&quot;:10,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Resumen&quot;},&quot;gastoReal&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:1840,&quot;min&quot;:0,&quot;max&quot;:20000,&quot;step&quot;:10,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Resumen&quot;}}">
const q = (n) => 'Q' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const qCorto = (n) => 'Q' + Math.round(n).toLocaleString('en-US');

class Component extends DCLogic {
  state = { hecho: false };

  renderVals() {
    const planificado = this.props.planificado ?? 2000;
    const real = this.props.gastoReal ?? 1840;
    const dif = planificado - real;
    const sobro = dif >= 0;

    return {
      planificado: q(planificado),
      real: q(real),
      ancho: Math.min(100, Math.round((real / planificado) * 100)) + '%',
      colorBarra: sobro ? 'linear-gradient(90deg, #2EE6A8, #17C68C)' : '#FFD166',
      estiloChip: {
        display: 'flex', alignItems: 'center', gap: '7px', marginTop: '13px',
        borderRadius: '15px', padding: '11px 13px', fontSize: '14px', fontWeight: 900,
        background: sobro ? 'rgba(46,230,168,0.18)' : 'rgba(255,209,102,0.28)',
        color: sobro ? '#0B7A54' : '#7A5606'
      },
      textoDiferencia: sobro
        ? 'Te sobraron ' + qCorto(dif) + ' del presupuesto'
        : 'Se pasaron ' + qCorto(-dif) + ' del presupuesto',
      textoPrimario: this.state.hecho ? 'Evento cerrado' : 'Cerrar evento y pasar los gastos',
      estiloPrimario: {
        width: '100%', border: 'none', borderRadius: '20px', minHeight: '58px', cursor: 'pointer',
        fontFamily: 'inherit', fontSize: '16.5px', fontWeight: 900, letterSpacing: '-0.015em',
        display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '9px', padding: '0 16px',
        background: '#2EE6A8', color: '#08301F',
        boxShadow: '0 10px 26px rgba(46,230,168,0.45)'
      },
      confirmar: () => this.setState({ hecho: true })
    };
  }
}
</script>
</body>
</html>
